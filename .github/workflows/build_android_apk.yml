name: 1. Build Signed Release Kotlin Android APK (Zero Laptop)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_signed_release_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate RSA-2048 Release Keystore for Secure APK Signing
        working-directory: ./android-kotlin-app/app
        env:
          KEYSTORE_PASS: ${{ secrets.MASTER_DECRYPTION_KEY || 'PulseForge2026Secure' }}
        run: |
          rm -f release-keystore.jks
          keytool -genkeypair -v             -keystore release-keystore.jks             -alias pulseforge_key             -keyalg RSA             -keysize 2048             -validity 10000             -storepass "$KEYSTORE_PASS"             -keypass "$KEYSTORE_PASS"             -dname "CN=PulseForge Studio, OU=Media Automation, O=PulseForge, L=Jamnagar, ST=Gujarat, C=IN"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed Release APK via Gradle
        working-directory: ./android-kotlin-app
        env:
          KEYSTORE_PASS: ${{ secrets.MASTER_DECRYPTION_KEY || 'PulseForge2026Secure' }}
        run: gradle assembleRelease --stacktrace

      - name: Upload Signed Release PulseForge-Studio-Pro.apk
        uses: actions/upload-artifact@v4
        with:
          name: PulseForge-Studio-Signed-Release-APK
          path: android-kotlin-app/app/build/outputs/apk/release/*.apk
