name: 2. Unified Zero-Leak Decrypt-Render-ReEncrypt Factory
on:
  schedule:
    - cron: '30 10 * * 1-5' # 4:00 PM IST India Post-Market Catch-Up
    - cron: '30 21 * * 1-5' # 4:30 PM EST US Wall Street Catch-Up
    - cron: '0 13 * * *'    # Daily Cricket/Football/Chat Story Slot
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'Target Channel ID (CH-01 to CH-08)'
        required: true
        default: 'CH-01'
      video_format:
        description: '9:16, 16:9, or auto'
        required: true
        default: 'auto'
      visual_theme:
        description: 'claude_pdf, bloomberg_dark, apple_bento, chat_story, sports_arena'
        required: true
        default: 'claude_pdf'
      voice_engine:
        description: 'gemini_native, kokoro_82m, or edge_ava'
        required: true
        default: 'gemini_native'
      data_mode:
        description: 'auto_api or manual_json'
        required: true
        default: 'auto_api'
      custom_topic:
        description: 'Optional Custom Headline / Topic'
        required: false
        default: ''

jobs:
  secure_ram_factory:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Encrypted Public Repo (Contains ONLY vault.enc)
        uses: actions/checkout@v4

      - name: 2. Install Runtime Dependencies Quietly
        run: |
          pip install --quiet google-genai yfinance edge-tts playwright google-api-python-client google-auth-oauthlib
          playwright install --with-deps chromium >/dev/null 2>&1

      - name: 3. Atomic In-RAM Decrypt -> Execute -> Rolling Re-Encrypt
        env:
          MASTER_KEY: ${{ secrets.MASTER_DECRYPTION_KEY || 'PF-2026-ULTRA-VAULT-99X' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_REFRESH_TOKEN_MAP: ${{ secrets.YT_REFRESH_TOKEN_MAP }}
        run: |
          set +x
          echo "::add-mask::$MASTER_KEY"
          RAM_VAULT="/dev/shm/.pf_ram_${GITHUB_RUN_ID}"
          mkdir -p "$RAM_VAULT"
          chmod 700 "$RAM_VAULT"

          # 1. Decrypt vault.enc strictly into RAM (/dev/shm)
          openssl enc -d -aes-256-cbc -pbkdf2 -in vault.enc -out "$RAM_VAULT/bundle.tar.gz" -pass env:MASTER_KEY
          tar -xzf "$RAM_VAULT/bundle.tar.gz" -C "$RAM_VAULT"
          rm -f "$RAM_VAULT/bundle.tar.gz"

          # 2. Run Verified Script + Gemini Search Grounding + Near-Human TTS in RAM
          python3 "$RAM_VAULT/generate_verified_script.py"             --channel "${{ github.event.inputs.channel_id || 'CH-01' }}"             --format "${{ github.event.inputs.video_format || 'auto' }}"             --theme "${{ github.event.inputs.visual_theme || 'claude_pdf' }}"             --voice "${{ github.event.inputs.voice_engine || 'gemini_native' }}"             --topic "${{ github.event.inputs.custom_topic || '' }}"

          # 3. Re-encrypt RAM bundle with a fresh cryptographic salt back into vault.enc
          tar -czf "$RAM_VAULT/repack.tar.gz" -C "$RAM_VAULT" generate_verified_script.py
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RAM_VAULT/repack.tar.gz" -out vault.enc -pass env:MASTER_KEY

      - name: 4. Guaranteed RAM Shredder Trap (Runs Even If Cancelled or Failed)
        if: always()
        run: |
          set +x
          rm -rf /dev/shm/.pf_ram_*
          echo "✓ Temporary RAM vault wiped 100% clean. Zero plain-text code left on runner."
