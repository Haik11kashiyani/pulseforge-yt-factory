name: 2. Unified Zero-Leak Decrypt-Render-ReEncrypt Factory
on:
  schedule:
    - cron: '30 10 * * 1-5' # 4:00 PM IST India Post-Market Catch-Up
    - cron: '30 21 * * 1-5' # 4:30 PM EST US Wall Street Catch-Up
    - cron: '0 13 * * *'    # Daily Cricket/Football/Chat Story Slot
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'Target Channel ID (CH-01 to CH-08)'
        required: true
        default: 'CH-05'
      video_format:
        description: '9:16, 16:9, or auto'
        required: true
        default: '9:16'
      visual_theme:
        description: 'claude_pdf, bloomberg_dark, apple_bento, chat_story, sports_arena'
        required: true
        default: 'sports_arena'
      voice_engine:
        description: 'kokoro_82m (ElevenLabs-grade Blended) or gemini_native'
        required: true
        default: 'kokoro_82m'
      data_mode:
        description: 'auto_api or manual_json'
        required: true
        default: 'auto_api'
      custom_topic:
        description: 'Optional Custom Headline / Topic'
        required: false
        default: 'Virat Kohli Top 5 Overseas Test Centuries'

jobs:
  secure_ram_factory:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Encrypted Public Repo (Contains ONLY vault.enc)
        uses: actions/checkout@v4

      - name: 2. Install Kokoro-82M Neural Voice, Playwright & FFmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet google-genai kokoro-onnx soundfile numpy yfinance edge-tts playwright google-api-python-client google-auth-oauthlib
          playwright install --with-deps chromium

      - name: 3. Atomic In-RAM Decrypt -> Render MP4 & PDF -> Re-Encrypt
        env:
          MASTER_KEY: ${{ secrets.MASTER_DECRYPTION_KEY || 'PF-2026-AES256-KEY' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +x
          echo "::add-mask::$MASTER_KEY"
          RAM_VAULT="/dev/shm/.pf_ram_${GITHUB_RUN_ID}"
          mkdir -p "$RAM_VAULT" /dev/shm/pulseforge/output /tmp/deliverables
          chmod 700 "$RAM_VAULT"

          # 1. Decrypt vault.enc into private RAM (/dev/shm)
          openssl enc -d -aes-256-cbc -pbkdf2 -in vault.enc -out "$RAM_VAULT/bundle.tar.gz" -pass env:MASTER_KEY
          tar -xzf "$RAM_VAULT/bundle.tar.gz" -C "$RAM_VAULT"
          rm -f "$RAM_VAULT/bundle.tar.gz"

          # 2. Generate Viral Script + Kokoro-82M Blended / Gemini Mastered Studio Audio
          python3 "$RAM_VAULT/generate_verified_script.py"             --channel "${{ github.event.inputs.channel_id || 'CH-05' }}"             --format "${{ github.event.inputs.video_format || '9:16' }}"             --theme "${{ github.event.inputs.visual_theme || 'sports_arena' }}"             --voice "${{ github.event.inputs.voice_engine || 'kokoro_82m' }}"             --topic "${{ github.event.inputs.custom_topic || 'Virat Kohli Top 5 Overseas Test Centuries' }}"

          # 3. Render 1080x1920 MP4 Video + 1-Page Claude PDF Report
          python3 "$RAM_VAULT/render_gsap_video_and_pdf.py"

          # 4. Copy ONLY final MP4 & PDF to /tmp/deliverables for Artifact download
          cp /dev/shm/pulseforge/output/final_youtube_video.mp4 /tmp/deliverables/
          cp /dev/shm/pulseforge/output/daily_claude_report.pdf /tmp/deliverables/
          cp /dev/shm/pulseforge/output/render_payload.json /tmp/deliverables/

          # 5. Rolling Re-Encryption of vault.enc
          tar -czf "$RAM_VAULT/repack.tar.gz" -C "$RAM_VAULT" generate_verified_script.py render_gsap_video_and_pdf.py
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RAM_VAULT/repack.tar.gz" -out vault.enc -pass env:MASTER_KEY

      - name: 4. Upload Rendered MP4 Video & PDF Report to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PulseForge-Rendered-Video-and-PDF
          path: |
            /tmp/deliverables/final_youtube_video.mp4
            /tmp/deliverables/daily_claude_report.pdf
            /tmp/deliverables/render_payload.json

      - name: 5. Guaranteed RAM Shredder Trap (Zero Code Left on Runner)
        if: always()
        run: |
          set +x
          rm -rf /dev/shm/.pf_ram_* /dev/shm/pulseforge
          echo "✓ Wiped temporary RAM vault 100% clean."
