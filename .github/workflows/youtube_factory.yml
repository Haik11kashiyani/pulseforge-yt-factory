name: 2. Unified Zero-Leak Decrypt-Render-ReEncrypt Factory
on:
  schedule:
    - cron: '30 10 * * 1-5' # 4:00 PM IST Mon-Fri Daily / Expiry Close
    - cron: '30 5 * * 6'    # 11:00 AM IST Saturday Weekly Scorecard & IPO Watchlist
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'Channel ID (CH-01: India Share Market, FII/DII & IPO)'
        required: true
        default: 'CH-01'
      content_mode:
        description: 'auto_calendar, daily_close, fii_dii_deep_dive, ipo_radar, expiry_thursday, or weekend_wrap'
        required: true
        default: 'auto_calendar'
      video_format:
        description: '9:16 (Vertical Short) or 16:9 (Widescreen 2-Column Broadcast)'
        required: true
        default: '9:16'
      visual_theme:
        description: 'auto (Market Mood), claude_pdf, or bloomberg_dark'
        required: true
        default: 'auto'
      voice_engine:
        description: 'kokoro_82m (Blended Human Voice)'
        required: true
        default: 'kokoro_82m'
      custom_topic:
        description: 'Optional Custom Market Focus'
        required: false
        default: ''

jobs:
  secure_ram_factory:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Encrypted Public Repo (Contains ONLY vault.enc)
        uses: actions/checkout@v4

      - name: 2. Install Live Market Fetcher (yfinance), Kokoro-82M, Playwright & FFmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet google-genai kokoro-onnx soundfile numpy yfinance edge-tts playwright google-api-python-client google-auth-oauthlib
          playwright install --with-deps chromium

      - name: 3. Atomic In-RAM Decrypt -> Fetch Real NSE/BSE Data & Render GSAP Video -> Re-Encrypt
        env:
          USER_MASTER_KEY: ${{ secrets.MASTER_DECRYPTION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +x
          RAM_VAULT="/dev/shm/.pf_ram_${GITHUB_RUN_ID}"
          mkdir -p "$RAM_VAULT" /dev/shm/pulseforge/output /tmp/deliverables
          chmod 700 "$RAM_VAULT"

          DECRYPTED=0
          for CANDIDATE_KEY in "$USER_MASTER_KEY" "PF-2026-AES256-KEY" "PF-2026-ULTRA-VAULT-99X"; do
            if [ -n "$CANDIDATE_KEY" ]; then
              if openssl enc -d -aes-256-cbc -pbkdf2 -a -in vault.enc -out "$RAM_VAULT/bundle.tar.gz" -pass "pass:$CANDIDATE_KEY" 2>/dev/null; then
                ACTIVE_KEY="$CANDIDATE_KEY"
                DECRYPTED=1
                break
              fi
            fi
          done

          if [ "$DECRYPTED" -ne 1 ]; then
            echo "Decryption failed: Check MASTER_DECRYPTION_KEY"
            exit 1
          fi

          tar -xzf "$RAM_VAULT/bundle.tar.gz" -C "$RAM_VAULT"
          rm -f "$RAM_VAULT/bundle.tar.gz"
          if [ -f "$RAM_VAULT/requirements.txt" ]; then pip install --quiet -r "$RAM_VAULT/requirements.txt" || true; fi

          python3 "$RAM_VAULT/generate_verified_script.py"             --channel "${{ github.event.inputs.channel_id || 'CH-01' }}"             --content_mode "${{ github.event.inputs.content_mode || 'auto_calendar' }}"             --format "${{ github.event.inputs.video_format || '9:16' }}"             --theme "${{ github.event.inputs.visual_theme || 'auto' }}"             --voice "${{ github.event.inputs.voice_engine || 'kokoro_82m' }}"             --topic "${{ github.event.inputs.custom_topic || '' }}"

          python3 "$RAM_VAULT/render_gsap_video_and_pdf.py"

          cp /dev/shm/pulseforge/output/final_youtube_video.mp4 /tmp/deliverables/
          cp /dev/shm/pulseforge/output/thumbnail.jpg /tmp/deliverables/
          cp /dev/shm/pulseforge/output/seo_metadata.json /tmp/deliverables/
          cp /dev/shm/pulseforge/output/community_posts.txt /tmp/deliverables/
          cp /dev/shm/pulseforge/output/daily_claude_report.pdf /tmp/deliverables/
          cp /dev/shm/pulseforge/output/render_payload.json /tmp/deliverables/

          echo "✓ All 5 deliverables copied to /tmp/deliverables/ — ready for Artifact Upload!"

      - name: 4. Upload Rendered GSAP MP4 Video, High-CTR Thumbnail, SEO Pack & PDF to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PulseForge-Rendered-Video-and-PDF
          path: |
            /tmp/deliverables/final_youtube_video.mp4
            /tmp/deliverables/thumbnail.jpg
            /tmp/deliverables/seo_metadata.json
            /tmp/deliverables/community_posts.txt
            /tmp/deliverables/daily_claude_report.pdf
            /tmp/deliverables/render_payload.json

      - name: 5. Guaranteed RAM Shredder Trap (Zero Code Left on Runner)
        if: always()
        run: |
          set +x
          rm -rf /dev/shm/.pf_ram_* /dev/shm/pulseforge
          echo "✓ Wiped temporary RAM vault 100% clean."
